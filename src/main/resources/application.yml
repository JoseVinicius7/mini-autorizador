spring:
    application:
        name: authorizer


    datasource:
        url: jdbc:mysql://localhost:3306/miniautorizador?useSSL=false&serverTimezone=UTC
        username: root
        password:
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        database-platform: org.hibernate.dialect.MySQL57Dialect
        hibernate:
            ddl-auto: update
        show-sql: true
    data:
        mongodb:
            uri: mongodb://user:password@localhost:27017/miniautorizador
            database: miniautorizador
